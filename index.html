<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Synonym Boom Cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f1fb;
        --bg-dot: #e2d9f5;
        --card: #ffffff;
        --ink: #2d3142;
        --ink-soft: #5a5f7a;
        --coral: #ff6b6b;
        --coral-dark: #e14b4b;
        --teal: #0fb5a3;
        --teal-dark: #089e8c;
        --sun: #ffc93c;
        --sun-dark: #e0a800;
        --sky: #4dabf7;
        --pink: #f783ac;
        --good: #2fbf71;
        --good-dark: #1e9e57;
        --bar-track: #e2d9f5;
        --shadow: 0 6px 0 rgba(45, 49, 66, 0.12);
        --panel-good: #e6fbef;
        --panel-soft: #fff3d6;
        --level-easy: #d3f9f3;
        --level-medium: #fff0bf;
        --level-hard: #ffe3ec;
        --choice: #7e57c2;
        --choice-dark: #6847a8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #221d33;
          --bg-dot: #322a48;
          --card: #313850;
          --ink: #f4f6ff;
          --ink-soft: #c3c9e0;
          --coral: #ff8585;
          --coral-dark: #ff6b6b;
          --teal: #2dd4bf;
          --teal-dark: #14b8a6;
          --sun: #ffd34d;
          --sun-dark: #ffc93c;
          --sky: #74c0fc;
          --pink: #faa2c1;
          --good: #51cf8a;
          --good-dark: #2fbf71;
          --bar-track: #454d68;
          --shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
          --panel-good: #1f4634;
          --panel-soft: #4d4023;
          --level-easy: #274b47;
          --level-medium: #4d4426;
          --level-hard: #4a3542;
          --choice: #9a7ede;
          --choice-dark: #7e57c2;
        }
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "Fredoka", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
        background:
          radial-gradient(circle at 12% 18%, var(--bg-dot) 0 26px, transparent 27px),
          radial-gradient(circle at 88% 78%, var(--bg-dot) 0 34px, transparent 35px),
          radial-gradient(circle at 78% 12%, var(--bg-dot) 0 18px, transparent 19px),
          var(--bg);
        color: var(--ink);
        min-height: 100vh;
        min-height: 100dvh;
      }

      .wrap { max-width: 680px; margin: 0 auto; padding: 18px 16px 40px; }

      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .pill {
        background: var(--card); border-radius: 999px; padding: 10px 18px;
        font-size: 1.15rem; font-weight: 600; box-shadow: var(--shadow);
        display: inline-flex; align-items: center; gap: 8px; min-height: 48px;
      }
      .pill .star-ico { font-size: 1.3rem; line-height: 1; }
      #scorePill.pop { animation: pop 0.35s ease; }
      @keyframes pop {
        0% { transform: scale(1); }
        40% { transform: scale(1.18) rotate(-2deg); }
        100% { transform: scale(1); }
      }

      .progress-shell {
        margin-top: 14px; background: var(--bar-track); border-radius: 999px;
        height: 26px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.12);
      }
      .progress-fill {
        height: 100%; width: 0%; border-radius: 999px;
        background: repeating-linear-gradient(-45deg, var(--teal) 0 16px, var(--teal-dark) 16px 32px);
        transition: width 0.55s cubic-bezier(0.34, 1.4, 0.64, 1);
      }
      .progress-label { margin-top: 8px; text-align: center; font-weight: 600; font-size: 1.05rem; color: var(--ink-soft); }

      /* ---------- Boom card ---------- */
      .boom-card {
        margin-top: 18px; background: var(--card); border-radius: 28px;
        box-shadow: var(--shadow), 0 0 0 6px var(--bg-dot);
        padding: 28px 20px; text-align: center;
        position: relative;
      }
      .level-badge {
        display: inline-block; border-radius: 999px; padding: 8px 20px;
        font-size: 1.1rem; font-weight: 700; letter-spacing: 0.14em; margin-bottom: 12px;
        box-shadow: 0 3px 0 rgba(45, 49, 66, 0.15);
      }
      .level-badge.easy { background: var(--level-easy); }
      .level-badge.medium { background: var(--level-medium); }
      .level-badge.hard { background: var(--level-hard); }
      .boom-question {
        margin: 0; font-size: clamp(1.5rem, 6.5vw, 2.1rem); font-weight: 700; line-height: 1.35;
      }
      .boom-question .target {
        color: var(--choice-dark);
        border-bottom: 4px solid var(--sun);
      }
      .boom-pic { font-size: clamp(4rem, 20vw, 6rem); line-height: 1.2; display: block; margin: 10px 0 4px; animation: bob 2.4s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

      /* ---------- Answer buttons (TheraPlatform purple) ---------- */
      .answers {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
      .answer {
        font-family: inherit;
        border: none; border-radius: 18px;
        background: var(--choice); color: #fff;
        padding: 20px 12px; min-height: 84px;
        font-size: clamp(1.25rem, 5.5vw, 1.6rem); font-weight: 600;
        cursor: pointer; touch-action: manipulation;
        box-shadow: 0 5px 0 var(--choice-dark);
        transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.25s ease;
      }
      .answer:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--choice-dark); }
      .answer:disabled { cursor: default; }
      .answer.is-dim { opacity: 0.35; }
      .answer.is-wrongpick { animation: gentle-shake 0.45s ease; }
      .answer.is-correct { background: var(--good); box-shadow: 0 5px 0 var(--good-dark); animation: boom-pulse 0.5s ease; }
      @keyframes boom-pulse {
        0% { transform: scale(1); }
        40% { transform: scale(1.08) rotate(-1.5deg); }
        100% { transform: scale(1); }
      }
      @keyframes gentle-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-8px); }
        75% { transform: translateX(8px); }
      }

      .card-count { margin: 16px 0 0; font-size: 1.05rem; font-weight: 600; color: var(--ink-soft); }

      .pop-particle { position: fixed; z-index: 60; pointer-events: none; border-radius: 50%; }

      /* ---------- Feedback + say-it ---------- */
      .feedback {
        margin-top: 18px; border-radius: 22px; padding: 18px 16px;
        font-size: clamp(1.15rem, 5vw, 1.4rem); font-weight: 600; line-height: 1.4; display: none; text-align: center;
      }
      .feedback.show { display: block; animation: rise 0.3s ease; }
      .feedback.good { background: var(--panel-good); }
      .feedback.soft { background: var(--panel-soft); }
      .feedback .points {
        display: inline-block; margin-top: 8px; background: var(--sun); color: #4d3b00;
        border-radius: 999px; padding: 4px 16px; font-weight: 700;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      .sayit-zone { margin-top: 18px; display: none; }
      .sayit-zone.show { display: block; animation: rise 0.3s ease; }
      .big-btn {
        font-family: inherit; width: 100%; border: none; border-radius: 22px;
        padding: 20px 16px; min-height: 84px; font-size: clamp(1.5rem, 6.5vw, 2rem);
        font-weight: 700; cursor: pointer; touch-action: manipulation;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .big-btn:active { transform: translateY(3px); }
      .btn-say { background: var(--sky); color: #fff; box-shadow: 0 6px 0 #2f7fc4; }
      @media (prefers-color-scheme: dark) { .btn-say { color: #0d2b45; } }
      .btn-say:active { box-shadow: 0 2px 0 #2f7fc4; }
      .btn-said { background: var(--sun); color: #4d3b00; box-shadow: 0 6px 0 var(--sun-dark); display: none; }
      .btn-said.show { display: block; }
      .btn-said:active { box-shadow: 0 2px 0 var(--sun-dark); }
      .sayit-hint { margin: 10px 0 0; font-size: 1.05rem; font-weight: 500; color: var(--ink-soft); }

      /* ---------- Win screen ---------- */
      .win { display: none; text-align: center; }
      .win.show { display: block; }
      .win .trophy { font-size: clamp(4.5rem, 22vw, 6.5rem); display: block; animation: bob 2s ease-in-out infinite; }
      .win h2 { margin: 8px 0 4px; font-size: clamp(2rem, 9vw, 3rem); font-weight: 700; color: var(--coral-dark); }
      .win p { font-size: 1.25rem; font-weight: 500; color: var(--ink-soft); margin: 6px 0; }
      .win .final-score { font-size: clamp(1.8rem, 8vw, 2.4rem); font-weight: 700; color: var(--ink); margin: 14px 0 4px; }
      .stars { font-size: clamp(3rem, 14vw, 4.2rem); letter-spacing: 0.12em; margin: 10px 0 6px; }
      .stars .earned { color: var(--sun-dark); display: inline-block; animation: star-in 0.5s ease backwards; }
      .stars .earned:nth-child(2) { animation-delay: 0.18s; }
      .stars .earned:nth-child(3) { animation-delay: 0.36s; }
      .stars .dim { color: var(--bar-track); }
      @keyframes star-in { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
      .btn-again { margin-top: 20px; background: var(--coral); color: #fff; box-shadow: 0 6px 0 var(--coral-dark); }
      @media (prefers-color-scheme: dark) { .btn-again { color: #451010; } }
      .btn-again:active { box-shadow: 0 2px 0 var(--coral-dark); }

      .friends-recap { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      .friends-recap span { background: var(--panel-good); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 1rem; }

      #confetti-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
      .confetti-piece { position: absolute; top: -4vh; will-change: transform, opacity; }

      @media (prefers-reduced-motion: reduce) {
        .boom-pic, .win .trophy { animation: none; }
        .answer.is-wrongpick, .answer.is-correct, .feedback.show, .sayit-zone.show, #scorePill.pop, .stars .earned { animation: none; }
        .progress-fill { transition: none; }
      }
    </style>
    <link rel="apple-touch-icon" href="/synonym-boom-cards-game/apple-touch-icon.png">
  </head>
  <body>
    <div id="confetti-layer" aria-hidden="true"></div>

    <div class="wrap">
      <div class="topbar">
        <span class="pill" id="roundPill">💥 Card <span id="roundNow">1</span> of 50</span>
        <span class="pill" id="scorePill"><span class="star-ico" aria-hidden="true">⭐</span> <span id="scoreNow">0</span> points</span>
      </div>
      <div class="progress-shell" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-label" id="progressLabel">Boom through all 50 cards! 💥</p>

      <main id="gameArea">
        <section class="boom-card" id="boomCard">
          <span class="level-badge easy" id="levelBadge">⭐ EASY</span>
          <h1 class="boom-question" id="boomQuestion">What is another word for <span class="target">sweet</span>?</h1>
          <span class="boom-pic" id="boomPic" aria-hidden="true">🍬</span>
          <div class="answers" id="answers" role="group" aria-label="Answer choices"></div>
          <p class="card-count" id="cardCount">1 / 50</p>
        </section>

        <div class="feedback" id="feedback" aria-live="polite"></div>

        <div class="sayit-zone" id="sayitZone">
          <button class="big-btn btn-say" id="sayBtn" type="button">🔊 Say it!</button>
          <p class="sayit-hint" id="sayitHint">Tap to hear it, then say it out loud!</p>
          <button class="big-btn btn-said" id="saidBtn" type="button">🗣️ I said it! +100</button>
        </div>
      </main>

      <section class="card win" id="winCard" aria-live="polite" style="margin-top:18px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:24px 18px;">
        <span class="trophy" aria-hidden="true">🏆</span>
        <h2>BOOM! You did it!</h2>
        <p>Synonyms — best friends forever! 🎉</p>
        <div class="stars" id="starsRow" aria-label="Stars earned"></div>
        <p class="final-score">⭐ <span id="finalScore">0</span> points</p>
        <p id="winMessage">Boom card champion!</p>
        <div class="friends-recap" id="friendsRecap"></div>
        <button class="big-btn btn-again" id="againBtn" type="button">🔁 Play Again</button>
      </section>
    </div>

    <script>
      (function () {
        "use strict";

        // Synonym Boom Cards — TheraPlatform style:
        // "What is another word for X?" + picture + 4 choices.
        // 9 REAL TheraPlatform items (from Perla's screenshots 2026-10-21;
        // "sleep" skipped — choices were cut off in the screenshot)
        // + 41 standard pairs in the same style = 50 cards, all different words.
        var CARDS = [
          // EASY (16)
          { level: "easy", word: "sweet", emoji: "🍬", answer: "sugary", others: ["candy", "sucker", "lollipop"] },
          { level: "easy", word: "friend", emoji: "👭", answer: "buddy", others: ["sister", "neighbor", "study"] },
          { level: "easy", word: "sick", emoji: "🤒", answer: "ill", others: ["nose", "tissue", "sneeze"] },
          { level: "easy", word: "happy", emoji: "😊", answer: "glad", others: ["smile", "party", "fun"] },
          { level: "easy", word: "big", emoji: "🐘", answer: "large", others: ["tall", "long", "wide"] },
          { level: "easy", word: "fast", emoji: "🏃", answer: "quick", others: ["run", "race", "car"] },
          { level: "easy", word: "small", emoji: "🐭", answer: "tiny", others: ["short", "thin", "baby"] },
          { level: "easy", word: "hot", emoji: "☀️", answer: "warm", others: ["sun", "fire", "summer"] },
          { level: "easy", word: "sad", emoji: "😢", answer: "unhappy", others: ["cry", "tears", "frown"] },
          { level: "easy", word: "new", emoji: "🆕", answer: "fresh", others: ["old", "young", "first"] },
          { level: "easy", word: "gift", emoji: "🎁", answer: "present", others: ["box", "bow", "party"] },
          { level: "easy", word: "house", emoji: "🏠", answer: "home", others: ["door", "roof", "room"] },
          { level: "easy", word: "laugh", emoji: "😂", answer: "giggle", others: ["funny", "joke", "smile"] },
          { level: "easy", word: "cry", emoji: "😭", answer: "sob", others: ["tears", "sad", "frown"] },
          { level: "easy", word: "smile", emoji: "😁", answer: "grin", others: ["happy", "teeth", "laugh"] },
          { level: "easy", word: "kind", emoji: "💛", answer: "nice", others: ["hug", "share", "gentle"] },
          // MEDIUM (18)
          { level: "medium", word: "infant", emoji: "👶", answer: "baby", others: ["young", "child", "little"] },
          { level: "medium", word: "draw", emoji: "✏️", answer: "sketch", others: ["write", "bicycle", "color"] },
          { level: "medium", word: "talk", emoji: "💬", answer: "chat", others: ["discussing", "spoken", "communication"] },
          { level: "medium", word: "same", emoji: "🧁", answer: "equal", others: ["share", "brownie", "size"] },
          { level: "medium", word: "cold", emoji: "❄️", answer: "chilly", others: ["ice", "snow", "winter"] },
          { level: "medium", word: "funny", emoji: "🤣", answer: "silly", others: ["laugh", "joke", "clown"] },
          { level: "medium", word: "mad", emoji: "😠", answer: "angry", others: ["shout", "fight", "storm"] },
          { level: "medium", word: "beautiful", emoji: "🌸", answer: "pretty", others: ["flower", "dress", "picture"] },
          { level: "medium", word: "begin", emoji: "🏁", answer: "start", others: ["first", "open", "go"] },
          { level: "medium", word: "end", emoji: "🔚", answer: "finish", others: ["last", "done", "over"] },
          { level: "medium", word: "quiet", emoji: "🤫", answer: "silent", others: ["shh", "calm", "soft"] },
          { level: "medium", word: "loud", emoji: "📢", answer: "noisy", others: ["shout", "drum", "bang"] },
          { level: "medium", word: "wet", emoji: "💧", answer: "damp", others: ["rain", "pool", "splash"] },
          { level: "medium", word: "clean", emoji: "🧼", answer: "tidy", others: ["soap", "wash", "neat"] },
          { level: "medium", word: "dirty", emoji: "🧹", answer: "messy", others: ["mud", "stain", "trash"] },
          { level: "medium", word: "sleepy", emoji: "😪", answer: "drowsy", others: ["bed", "yawn", "nap"] },
          { level: "medium", word: "job", emoji: "💼", answer: "work", others: ["office", "boss", "money"] },
          { level: "medium", word: "ocean", emoji: "🌊", answer: "sea", others: ["wave", "beach", "fish"] },
          // HARD (16)
          { level: "hard", word: "select", emoji: "👗", answer: "pick", others: ["dress", "pink", "wear"] },
          { level: "hard", word: "courageous", emoji: "🪖", answer: "brave", others: ["soldier", "army", "commander"] },
          { level: "hard", word: "tired", emoji: "😴", answer: "weary", others: ["sleep", "bed", "yawn"] },
          { level: "hard", word: "rich", emoji: "💰", answer: "wealthy", others: ["money", "gold", "cash"] },
          { level: "hard", word: "smart", emoji: "🧠", answer: "clever", others: ["book", "school", "test"] },
          { level: "hard", word: "mean", emoji: "😒", answer: "rude", others: ["bully", "frown", "fight"] },
          { level: "hard", word: "road", emoji: "🛣️", answer: "street", others: ["car", "drive", "sign"] },
          { level: "hard", word: "look", emoji: "👀", answer: "see", others: ["eyes", "glasses", "blink"] },
          { level: "hard", word: "yell", emoji: "📣", answer: "shout", others: ["loud", "voice", "echo"] },
          { level: "hard", word: "push", emoji: "🫷", answer: "shove", others: ["hand", "door", "cart"] },
          { level: "hard", word: "pull", emoji: "🪢", answer: "tug", others: ["rope", "wagon", "hands"] },
          { level: "hard", word: "throw", emoji: "⚾", answer: "toss", others: ["ball", "catch", "pitch"] },
          { level: "hard", word: "catch", emoji: "🧤", answer: "grab", others: ["ball", "mitt", "hold"] },
          { level: "hard", word: "fix", emoji: "🔧", answer: "repair", others: ["tool", "broken", "glue"] },
          { level: "hard", word: "break", emoji: "💔", answer: "snap", others: ["crack", "crash", "smash"] },
          { level: "hard", word: "jump", emoji: "🐇", answer: "leap", others: ["run", "skip", "bounce"] }
        ];
        var LEVEL_LABELS = { easy: "⭐ EASY", medium: "💪 MEDIUM", hard: "🔥 HARD" };
        var TOTAL = CARDS.length;

        var rounds = [];
        var roundIndex = 0;
        var score = 0;
        var firstTryWins = 0;
        var locked = false;

        var el = {
          roundNow: document.getElementById("roundNow"),
          scoreNow: document.getElementById("scoreNow"),
          scorePill: document.getElementById("scorePill"),
          progressFill: document.getElementById("progressFill"),
          progressBar: document.getElementById("progressBar"),
          progressLabel: document.getElementById("progressLabel"),
          gameArea: document.getElementById("gameArea"),
          winCard: document.getElementById("winCard"),
          levelBadge: document.getElementById("levelBadge"),
          boomQuestion: document.getElementById("boomQuestion"),
          boomPic: document.getElementById("boomPic"),
          answers: document.getElementById("answers"),
          cardCount: document.getElementById("cardCount"),
          feedback: document.getElementById("feedback"),
          sayitZone: document.getElementById("sayitZone"),
          sayBtn: document.getElementById("sayBtn"),
          saidBtn: document.getElementById("saidBtn"),
          sayitHint: document.getElementById("sayitHint"),
          finalScore: document.getElementById("finalScore"),
          starsRow: document.getElementById("starsRow"),
          winMessage: document.getElementById("winMessage"),
          friendsRecap: document.getElementById("friendsRecap"),
          againBtn: document.getElementById("againBtn"),
          confettiLayer: document.getElementById("confetti-layer")
        };

        function shuffle(arr) {
          var a = arr.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i]; a[i] = a[j]; a[j] = t;
          }
          return a;
        }

        function setScore(points) {
          score += points;
          el.scoreNow.textContent = score;
          el.scorePill.classList.remove("pop");
          void el.scorePill.offsetWidth;
          el.scorePill.classList.add("pop");
        }

        function setProgress(done) {
          var pct = Math.round((done / TOTAL) * 100);
          el.progressFill.style.width = pct + "%";
          el.progressBar.setAttribute("aria-valuenow", done);
          if (done >= TOTAL) el.progressLabel.textContent = "All 50 boom cards done! 🎉";
          else if (done === 0) el.progressLabel.textContent = "Boom through all 50 cards! 💥";
          else el.progressLabel.textContent = done + " of 50 boom cards done! 💥";
        }

        /* ---------- Confetti (hand-rolled, no library) ---------- */
        var CONFETTI_COLORS = ["#ff6b6b", "#ffc93c", "#0fb5a3", "#4dabf7", "#f783ac", "#2fbf71"];
        function confettiBurst(count) {
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          for (var i = 0; i < count; i++) {
            var piece = document.createElement("div");
            piece.className = "confetti-piece";
            var size = 8 + Math.random() * 10;
            piece.style.width = size + "px";
            piece.style.height = (Math.random() > 0.5 ? size : size * 0.45) + "px";
            piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
            piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
            piece.style.left = (Math.random() * 100) + "vw";
            el.confettiLayer.appendChild(piece);
            var drift = (Math.random() - 0.5) * 220;
            var spin = (Math.random() - 0.5) * 720;
            var fall = window.innerHeight * (0.75 + Math.random() * 0.35);
            var anim = piece.animate(
              [
                { transform: "translate(0, -5vh) rotate(0deg)", opacity: 1 },
                { transform: "translate(" + drift + "px, " + fall + "px) rotate(" + spin + "deg)", opacity: 0.9 }
              ],
              { duration: 1400 + Math.random() * 1200, easing: "cubic-bezier(0.2, 0.7, 0.4, 1)", delay: Math.random() * 200 }
            );
            (function (p, a) {
              var done = function () { if (p.parentNode) p.parentNode.removeChild(p); };
              if (a && a.finished && a.finished.then) { a.finished.then(done).catch(done); }
              else { setTimeout(done, 3000); }
            })(piece, anim);
          }
        }

        /* ---------- Boom particles ---------- */
        function boomParticles(x, y, colors) {
          if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          for (var i = 0; i < 14; i++) {
            var p = document.createElement("div");
            p.className = "pop-particle";
            var size = 8 + Math.random() * 10;
            p.style.width = size + "px";
            p.style.height = size + "px";
            p.style.background = colors[i % colors.length];
            p.style.left = x + "px";
            p.style.top = y + "px";
            document.body.appendChild(p);
            var ang = (Math.PI * 2 * i) / 14 + Math.random() * 0.5;
            var dist = 56 + Math.random() * 56;
            var anim = p.animate(
              [
                { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
                { transform: "translate(" + (Math.cos(ang) * dist - size / 2) + "px," + (Math.sin(ang) * dist - size / 2) + "px) scale(0.2)", opacity: 0 }
              ],
              { duration: 550 + Math.random() * 250, easing: "ease-out" }
            );
            (function (el2, a) {
              var done = function () { if (el2.parentNode) el2.parentNode.removeChild(el2); };
              if (a && a.finished && a.finished.then) { a.finished.then(done).catch(done); }
              else { setTimeout(done, 1000); }
            })(p, anim);
          }
        }

        /* ---------- Speech ---------- */
        function speak(text) {
          try {
            if (!("speechSynthesis" in window)) return;
            window.speechSynthesis.cancel();
            var u = new SpeechSynthesisUtterance(text);
            u.rate = 0.92;
            u.pitch = 1.1;
            window.speechSynthesis.speak(u);
          } catch (e) { /* speech is a bonus — game continues without it */ }
        }

        /* ---------- Round flow ---------- */
        function startGame() {
          rounds = CARDS.slice(); // fixed progressive order: easy → medium → hard
          roundIndex = 0;
          score = 0;
          firstTryWins = 0;
          el.scoreNow.textContent = "0";
          setProgress(0);
          el.winCard.classList.remove("show");
          el.gameArea.style.display = "";
          renderRound();
        }

        function current() { return rounds[roundIndex]; }

        function renderRound() {
          locked = false;
          var r = current();
          el.roundNow.textContent = (roundIndex + 1);
          el.cardCount.textContent = (roundIndex + 1) + " / " + TOTAL;
          el.levelBadge.className = "level-badge " + r.level;
          el.levelBadge.textContent = LEVEL_LABELS[r.level];
          el.boomQuestion.innerHTML = "";
          el.boomQuestion.appendChild(document.createTextNode("What is another word for "));
          var target = document.createElement("span");
          target.className = "target";
          target.textContent = r.word;
          el.boomQuestion.appendChild(target);
          el.boomQuestion.appendChild(document.createTextNode("?"));
          el.boomPic.textContent = r.emoji;

          el.feedback.className = "feedback";
          el.feedback.textContent = "";
          el.sayitZone.classList.remove("show");
          el.sayBtn.style.display = "";
          el.saidBtn.classList.remove("show");

          el.answers.innerHTML = "";
          var options = shuffle([{ text: r.answer, isAnswer: true }].concat(
            r.others.map(function (o) { return { text: o, isAnswer: false }; })
          ));
          options.forEach(function (opt) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "answer";
            b.textContent = opt.text;
            b.setAttribute("aria-label", "Answer: " + opt.text);
            b.addEventListener("click", function () { pick(b, opt); });
            el.answers.appendChild(b);
          });
          setProgress(roundIndex);
        }

        function pick(btn, opt) {
          if (locked || btn.disabled) return;
          var r = current();
          var buttons = el.answers.querySelectorAll(".answer");

          if (opt.isAnswer) {
            locked = true;
            firstTryWins++;
            var rect = btn.getBoundingClientRect();
            boomParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, ["#7e57c2", "#ffc93c", "#ffffff"]);
            btn.classList.add("is-correct");
            setScore(100);
            buttons.forEach(function (b) { if (b !== btn) { b.disabled = true; b.classList.add("is-dim"); } });
            el.feedback.className = "feedback show good";
            el.feedback.innerHTML = "";
            el.feedback.appendChild(document.createTextNode("💥 BOOM! \"" + r.answer.toUpperCase() + "\" means the same as \"" + r.word.toUpperCase() + "\" — best friends!"));
            var pts = document.createElement("span");
            pts.className = "points";
            pts.textContent = "+100 points!";
            el.feedback.appendChild(document.createElement("br"));
            el.feedback.appendChild(pts);
            confettiBurst(50);
            speak("Boom! Yes! " + r.answer + " means the same as " + r.word + "!");
            showSayIt(r);
          } else {
            btn.classList.add("is-wrongpick");
            btn.classList.add("is-dim");
            btn.disabled = true;
            el.feedback.className = "feedback show soft";
            el.feedback.textContent = "💛 Oops! Remember: synonyms are BEST FRIENDS — they mean the SAME thing! Try again!";
            speak("Oops! Synonyms are best friends — they mean the same thing! Try again!");
            setTimeout(function () { btn.classList.remove("is-wrongpick"); }, 500);
          }
        }

        function showSayIt(r) {
          el.sayitZone.classList.add("show");
          el.sayBtn.style.display = "";
          el.saidBtn.classList.remove("show");
          el.sayitHint.textContent = "Tap to hear \"" + r.word + " means " + r.answer + "\", then say it out loud!";
          el.sayBtn.setAttribute("data-spoken", r.word + " means " + r.answer);
        }

        el.sayBtn.addEventListener("click", function () {
          var spoken = el.sayBtn.getAttribute("data-spoken");
          speak(spoken + "! " + spoken + "!");
          el.sayBtn.style.display = "none";
          el.sayitHint.textContent = "Your turn — say it out loud! 🌟";
          el.saidBtn.classList.add("show");
          el.saidBtn.focus();
        });

        el.saidBtn.addEventListener("click", function () {
          setScore(100);
          confettiBurst(18);
          roundIndex++;
          if (roundIndex >= TOTAL) {
            setProgress(TOTAL);
            showWin();
          } else {
            setProgress(roundIndex);
            renderRound();
          }
        });

        function showWin() {
          el.gameArea.style.display = "none";
          el.roundNow.textContent = TOTAL;
          el.finalScore.textContent = score;

          var stars = 1;
          if (firstTryWins >= 11) stars = 3;
          else if (firstTryWins >= 7) stars = 2;

          el.starsRow.innerHTML = "";
          for (var i = 0; i < 3; i++) {
            var s = document.createElement("span");
            s.textContent = "★";
            s.className = i < stars ? "earned" : "dim";
            el.starsRow.appendChild(s);
          }
          el.starsRow.setAttribute("aria-label", stars + " out of 3 stars earned");

          if (stars === 3) el.winMessage.textContent = "WOW! You boomed almost every card on the first try! 🌟";
          else if (stars === 2) el.winMessage.textContent = "Great booming, synonym superstar! 🌟";
          else el.winMessage.textContent = "You boomed all 50 cards — great practicing! 🌟";

          el.friendsRecap.innerHTML = "";
          rounds.forEach(function (r) {
            var chip = document.createElement("span");
            chip.textContent = r.emoji + " " + r.word + " = " + r.answer;
            el.friendsRecap.appendChild(chip);
          });

          el.winCard.classList.add("show");
          confettiBurst(90);
          speak("Boom! You did it! Synonyms — best friends forever!");
        }

        el.againBtn.addEventListener("click", startGame);

        startGame();
      })();
    </script>
  </body>
</html>
